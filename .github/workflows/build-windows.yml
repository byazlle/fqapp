# =============================================================================
# 番茄端碗 - Windows 桌面版云端自动构建 (GitHub Actions, 免费 Windows runner)
# -----------------------------------------------------------------------------
# 触发方式:
#   1. 手动: Actions 页 -> "Build Windows (cloud)" -> Run workflow
#   2. 打 tag: git tag v1.2.3 && git push --tags  -> 自动出安装包并建 Release
#   3. 推送 master 且改动涉及 rust/lib/pubspec/scripts 等 (见下方 paths)
#
# 产物:
#   - 每次运行在 "Artifacts" 里提供 fanqieduanwan-setup-x64.exe (可直接下载安装)
#   - 打 tag 时额外在 Releases 页发布同一安装包
#
# 说明:
#   - 本流程使用 GitHub 自动提供的 secrets.GITHUB_TOKEN，无需把你的 PAT 写进来。
#   - 仓库里的 .env / GITHUB_TOKEN 仅用于「本地」运行，与云端构建无关。
#   - 构建在 GitHub 托管的 Windows 机器上完成，本地电脑无需安装任何开发环境。
# =============================================================================

name: Build Windows (cloud)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]
  push:
    tags: ['v*']
    branches: [master]
    paths:
      - 'rust/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'flutter_rust_bridge.yaml'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write   # 用于 softprops/action-gh-release 在打 tag 时发布安装包

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  FRB_VERSION: '2.13.0'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo (registry, git, target, codegen bin)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Show tool versions
        shell: pwsh
        run: |
          flutter --version
          rustc --version
          cargo --version

      - name: Pub get
        run: flutter pub get

      # ── 质量门禁：发布前先跑静态分析与测试，任一失败即阻断构建/发布。
      - name: Static analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Rust tests
        working-directory: rust
        shell: pwsh
        run: cargo test

      - name: Build (codegen + Rust core dll + Flutter Windows)
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Profile ${{ github.event.inputs.profile || 'release' }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      # media_kit 随包分发 libmpv（MSVC 构建），依赖 VC++ 2015-2022 运行库。
      # 部分用户机器没有它，会把“缺 vcruntime140.dll”说成“打不开”。
      # 这里下载官方 vcredist，由安装程序先装它（已装则跳过）。
      - name: Fetch VC++ redistributable (libmpv dependency)
        shell: pwsh
        run: |
          curl.exe -L --retry 3 --retry-delay 5 -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          $size = (Get-Item vc_redist.x64.exe).Length
          if ($size -lt 1MB) { throw "vc_redist.x64.exe 下载异常: $size bytes" }
          Write-Host "vc_redist.x64.exe = $size bytes"

      - name: Build installer (substitute version from pubspec)
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([\d.]+)').Matches.Groups[1].Value
          (Get-Content windows/installer.iss) -replace '#define MyAppVersion "[^"]*"', "#define MyAppVersion `"$ver`"" | Set-Content windows/installer.iss
          $src  = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $lang = (Resolve-Path 'windows/languages').Path
          $vc   = (Resolve-Path 'vc_redist.x64.exe').Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & "$iscc" "windows/installer.iss" "/DAppSourceDir=$src" "/DLangDir=$lang" "/DVcRedist=$vc"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanqieduanwan-windows-setup
          path: '**/fanqieduanwan-setup-x64.exe'
          if-no-files-found: error

      # 计算安装包 SHA256，写入 Release 说明并附带校验文件，便于用户核对下载
      # 完整性（P3-⑨/⑫）。
      - name: Compute SHA256 and build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([\d.]+)').Matches.Groups[1].Value
          $exe = Get-ChildItem -Recurse -Filter fanqieduanwan-setup-x64.exe | Select-Object -First 1
          if (-not $exe) { throw '找不到 fanqieduanwan-setup-x64.exe' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $size = '{0:N1} MB' -f ($exe.Length / 1MB)
          # 若仓库带 CHANGELOG.md，取出本 tag 对应的小节拼进 Release 说明。
          $changelog = ''
          if (Test-Path CHANGELOG.md) {
            $cl = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $cl.Count; $i++) {
              if ($cl[$i] -match "^##\s*\[?$([regex]::Escape($ver))\]?") { $start = $i + 1; break }
            }
            if ($start -ge 0) {
              $section = New-Object System.Collections.Generic.List[string]
              for ($i = $start; $i -lt $cl.Count; $i++) {
                if ($cl[$i] -match '^##\s') { break }
                $section.Add($cl[$i])
              }
              $changelog = ($section -join "`n").Trim()
            }
          }
          $body = New-Object System.Collections.Generic.List[string]
          $body.Add("## 番茄端碗 $ver")
          $body.Add("")
          if ($changelog) {
            $body.Add($changelog)
            $body.Add("")
          }
          $body.Add("### 安装包")
          $body.Add("")
          $body.Add("- 文件：fanqieduanwan-setup-x64.exe（$size）")
          $body.Add("- SHA256：$hash")
          $body.Add("")
          $body.Add("下载后在 PowerShell 中校验：")
          $body.Add("")
          $body.Add('```powershell')
          $body.Add('Get-FileHash .\fanqieduanwan-setup-x64.exe -Algorithm SHA256')
          $body.Add('```')
          $body.Add("")
          $body.Add("输出应与上方 SHA256 一致。")
          $body -join "`n" | Out-File -FilePath release-notes.md -Encoding utf8
          "$hash  fanqieduanwan-setup-x64.exe" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/fanqieduanwan-setup-x64.exe
            SHA256SUMS.txt
          body_path: release-notes.md

  # ---------------------------------------------------------------------------
  # ARM64 实验性构建（P3-⑩）：Windows on ARM 的 Flutter 桌面支持仍在演进，
  # 该任务只做「能构建就产出未打包原始产物」的探索。continue-on-error 保证它
  # 失败时不影响 x64 正式安装包的构建与发布；手动触发或打 tag 时才运行。
  # ---------------------------------------------------------------------------
  build-windows-arm64:
    name: Build Windows ARM64 (experimental)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust (arm64)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Pub get
        run: flutter pub get

      - name: Build Rust core (arm64)
        working-directory: rust
        shell: pwsh
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Build Flutter Windows (arm64)
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop | Out-Null
          flutter build windows --release

      - name: Upload raw ARM64 build (if produced)
        uses: actions/upload-artifact@v4
        with:
          name: fanqieduanwan-windows-arm64-raw
          path: build/windows/**/runner/Release/**
          if-no-files-found: warn
